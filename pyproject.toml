[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-align"
version = "0.1.0"
description = "Technical Alignment & Interpretability Audit Framework, built against the AI 2040 Plan A alignment roadmap"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan" }]
keywords = ["ai-safety", "interpretability", "alignment", "ai-2040", "chain-of-thought", "sparse-autoencoder"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "flask>=3.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
hf = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = ["lumen-align[llm,hf,dev]"]

[project.scripts]
lumen = "lumen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
